{% extends "base.html" %}
{% block title %}{{ '编辑' if page else '添加' }}页面{% endblock %}
{% block content %}
<div class="page-title">{{ '编辑' if page else '添加' }}页面 - {{ site.name }}</div>
<form method="POST" style="max-width:600px;">
    <div class="form-group">
        <label>页面名称 *</label>
        <input type="text" name="name" value="{{ page.name if page else '' }}" required placeholder="例如：首页 / 登录页">
    </div>
    <div class="form-group">
        <label>页面 URL *</label>
        <input type="text" name="url" value="{{ page.url if page else '' }}" required placeholder="例如：https://www.xxx.gov.cn/login">
        <span class="text-muted">完整的页面 URL，精确到具体页面路径</span>
    </div>
    {% if page %}
    <div class="form-group">
        <label>启用状态</label>
        <select name="enabled">
            <option value="1" {{ 'selected' if page.enabled else '' }}>启用</option>
            <option value="0" {{ 'selected' if not page.enabled else '' }}>暂停</option>
        </select>
    </div>
    {% endif %}
    <div class="btn-group">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('pages', sid=page.site_id if page else site.id) }}" class="btn btn-outline">取消</a>
    </div>
</form>
{% endblock %}
